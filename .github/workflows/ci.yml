name: CI

# 設計文書が繰り返し「リンク切れは CI で落ちる」(s-02)と言っているので、
# その CI を実在させる。落ちる条件は 3 つ:
#   1. テストが落ちる
#   2. 生成物(schema / Handover.*)が正本に追従していない
#   3. .pyn の往復・参照・schema 適合が崩れている

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 本体は標準ライブラリのみ。pytest はテスト実行にだけ要る。
      - name: pytest を入れる
        run: python -m pip install --upgrade pytest

      - name: テスト(本体は外部依存なし)
        run: python -m pytest tests -q
        env:
          PYTHONIOENCODING: utf-8

      - name: schema が model に追従しているか
        run: python -m tools.build_schema --check
        env:
          PYTHONIOENCODING: utf-8

      - name: .pyn の往復・参照・schema 適合
        run: |
          python -m pyn check samples/auth-spec.pyn
          python -m pyn check Handover.pyn
          python -m pyn check docs/prose-dialect.pyn
        env:
          PYTHONIOENCODING: utf-8
