name: CI

# 設計文書が繰り返し「リンク切れは CI で落ちる」(s-02)と言っているので、
# その CI を実在させる。落ちる条件は 3 つ:
#   1. テストが落ちる
#   2. 生成物(schema / Handover.*)が正本に追従していない
#   3. .pyn の往復・参照・schema 適合が崩れている

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 下限(pyproject.toml の requires-python)と最新の両方で回す
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # check_ids が HEAD~1 と比べるため

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # 本体は標準ライブラリのみ。pytest はテスト実行にだけ要る。
      - name: pytest を入れる
        run: python -m pip install --upgrade pytest

      - name: テスト(本体は外部依存なし)
        run: python -m pytest tests -q
        env:
          PYTHONIOENCODING: utf-8

      - name: schema が model に追従しているか
        run: python -m tools.build_schema --check
        env:
          PYTHONIOENCODING: utf-8

      - name: 一度振った ID が消えていないか(cost-1)
        run: python -m tools.check_ids --base HEAD~1
        env:
          PYTHONIOENCODING: utf-8

      - name: 引継ぎ文書の生成物が Handover.pyn に追従しているか
        run: python -m tools.handover_to_pyn --check
        env:
          PYTHONIOENCODING: utf-8

      - name: .pyn から生成した文書(AGENTS.md ほか)が追従しているか
        run: python -m tools.build_docs --check
        env:
          PYTHONIOENCODING: utf-8

      - name: .pyn の往復・参照・schema 適合
        run: |
          python -m pyn check samples/auth-spec.pyn
          python -m pyn check Handover.pyn
          python -m pyn check docs/prose-dialect.pyn
          python -m pyn check docs/agents.pyn
          python -m pyn check docs/readme.pyn
          python -m pyn check docs/knowledge-intake.pyn
          python -m pyn check docs/query.pyn
          python -m pyn check docs/db.pyn
          python -m pyn check docs/physics.pyn
          python -m pyn.knowledge check samples/intake/knowledge.pyn
          python -m pyn.guardrails scan-tree samples
          python -m pyn.physics check samples/physics/bell.pyn
          python -m tools.physics_samples --check
        env:
          PYTHONIOENCODING: utf-8

  # t-20: pip で入れたものが、リポジトリの外でそのまま動くこと。
  # テストはリポジトリの中で動くので、schema/ のようなリポジトリ内のファイルに
  # 頼っていても気づけない。ここではそれを外から確かめる。
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: pip で入れる
        run: python -m pip install .

      - name: リポジトリの外で pyn コマンドを動かす
        working-directory: ${{ runner.temp }}
        # Windows の既定(pwsh)は途中のコマンドの失敗で止まらないので bash に揃える
        shell: bash
        run: |
          python -c "import pyn; print(pyn.__version__, pyn.__file__)"
          pyn check "${{ github.workspace }}/samples/auth-spec.pyn"
          pyn check "${{ github.workspace }}/Handover.pyn"
          pyn md "${{ github.workspace }}/samples/auth-spec.pyn" -o out.md
          # t-26: 拡張モジュールも配布物に入っている(終了コード 0 = approvable)
          python -m pyn.intake evaluate "${{ github.workspace }}/samples/intake/knowledge.pyn" "${{ github.workspace }}/samples/intake/proposal-observation.pyn" -o report.json
          # t-27: 複数文書の検索(終了コード 0 = 見つかった)。結果は pyn check を通る
          python -m pyn.query find patch --root "${{ github.workspace }}" --in "${{ github.workspace }}/Handover.pyn" "${{ github.workspace }}/docs" -o result.pyn
          pyn check result.pyn
          # t-28: SQLite への射影。作って、読むだけの SQL を流し、元の文書に追従しているかを見る
          python -m pyn.db build --root "${{ github.workspace }}" --in "${{ github.workspace }}/Handover.pyn" "${{ github.workspace }}/docs" -o pyn.sqlite
          python -m pyn.db sql pyn.sqlite "SELECT count(*) AS n FROM nodes" -o rows.pyn
          pyn check rows.pyn
          python -m pyn.db verify pyn.sqlite --root "${{ github.workspace }}"
          # t-32: 物理の層。関係表の検証と、関係表から作る時間の流れ(終了コード 0 = 問題なし)
          python -m pyn.physics check "${{ github.workspace }}/samples/physics/pair.pyn"
          python -m pyn.physics flow "${{ github.workspace }}/samples/physics/pair.pyn" -d dA
          # t-21: 書き出しは OS によらず LF(Windows の既定のままだと CRLF になる)
          pyn a "${{ github.workspace }}/samples/auth-spec.pyn" -o out.pyn
          python -c "import sys; sys.exit(b'\r' in open('out.pyn', 'rb').read())"
